<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h2>Crear Gasto</h2>

<div th:if="${error}" style="color:red;">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/expenses}" th:object="${expenseForm}" method="post">
    <input type="text" th:field="*{description}" placeholder="Descripción"/>
    <input type="number" step="0.01" th:field="*{amount}" placeholder="Monto"/>
    <input type="number" th:field="*{userId}" placeholder="User ID"/>
    <input type="number" th:field="*{groupId}" placeholder="Group ID"/>

    <button type="submit">Crear</button>
</form>

</body>
</html>
