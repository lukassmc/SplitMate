
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SplitMate · Unirse a grupo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="topbar">
    <div class="logo-wrap">
        <div class="logo-mark">
            <div class="lb lb1"></div>
            <div class="lb lb2"></div>
            <div class="lb lb3"></div>
        </div>
        <span class="wordmark">Split<span>Mate</span></span>
    </div>
    <div class="topbar-right">
        <a th:href="@{/logout}" class="btn btn-ghost btn-sm">Salir</a>
    </div>
</header>

<main class="main-content" style="max-width:480px">

    <a th:href="@{/dashboard}" class="back-link">← Volver</a>

    <div class="auth-card" style="margin-top:24px">
        <h2 class="auth-title">Unirme a un grupo</h2>
        <p class="auth-sub">Ingresá el código que te compartieron</p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/groups/join}" method="post">
            <div class="form-group">
                <label>Código de invitación</label>
                <input type="text"
                       name="inviteCode"
                       placeholder="ej: A1B2C3"
                       maxlength="6"
                       style="text-transform:uppercase;letter-spacing:0.1em;font-size:18px;text-align:center"
                       required autofocus/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Unirme al grupo</button>
        </form>
    </div>

</main>

</body>
</html>
