
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SplitMate · Nuevo grupo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="topbar">
    <div class="logo-wrap">
        <div class="logo-mark">
            <div class="lb lb1"></div>
            <div class="lb lb2"></div>
            <div class="lb lb3"></div>
        </div>
        <span class="wordmark">Split<span>Mate</span></span>
    </div>
    <div class="topbar-right">
        <a th:href="@{/logout}" class="btn btn-ghost btn-sm">Salir</a>
    </div>
</header>

<main class="main-content" style="max-width:480px">

    <a th:href="@{/dashboard}" class="back-link">← Volver</a>

    <div class="auth-card" style="margin-top:24px">
        <h2 class="auth-title">Crear grupo</h2>
        <p class="auth-sub">Se te agregará automáticamente como administrador</p>

        <form th:action="@{/groups/save}" th:object="${groupForm}" method="post">
            <div class="form-group">
                <label>Nombre del grupo</label>
                <input type="text" th:field="*{name}" placeholder="ej: Viaje a Mendoza" required autofocus/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Crear grupo</button>
        </form>
    </div>

</main>

</body>
</html>
